[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bayu"
version = "0.1.0"
description = "Nonlocal (fractional-order) closure for the Ekman layer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Sandy H. S. Herho" },
    { name = "Faizal A. R. Abdullah" },
    { name = "Rusmawan Suwarman" },
    { name = "Deny J. Puradimaja" },
    { name = "Dasapta E. Irawan" },
]
keywords = ["Ekman layer", "fractional calculus", "geophysical fluid dynamics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "mpmath>=1.3",
]

[project.optional-dependencies]
lint = ["pycodestyle>=2.11", "pydocstyle>=6.3"]

[tool.setuptools]
packages = ["bayu"]

[tool.pydocstyle]
convention = "pep257"
